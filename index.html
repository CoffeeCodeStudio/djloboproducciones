    <!-- White-screen detector: if the React app hasn't reported "alive" within
         3s (and #main-content isn't painted), try a soft recovery; after a
         further 4s without recovery, force a hard reload (once per session). -->
    <script>
      (function () {
        try {
          var SOFT_TIMEOUT = 3000;
          var HARD_TIMEOUT = 7000; // total from boot
          var RELOAD_FLAG = "__lovable_white_screen_reloaded__";
          var bootedAt = Date.now();
          var alive = false;

          // Emit a structured event the in-app debug overlay can listen to.
          function emit(kind, detail) {
            try {
              var payload = Object.assign(
                { kind: kind, t: Date.now() - bootedAt },
                detail || {}
              );
              // Buffer events so the overlay (mounted later) can replay them.
              window.__lovableWsEvents = window.__lovableWsEvents || [];
              window.__lovableWsEvents.push(payload);
              window.dispatchEvent(
                new CustomEvent("lovable:white-screen-event", { detail: payload })
              );
            } catch (e) {}
          }

          emit("boot", { softTimeout: SOFT_TIMEOUT, hardTimeout: HARD_TIMEOUT });

          window.__lovableReportAlive = function () {
            if (alive) return;
            alive = true;
            window.__lovableAlive = true;
            emit("alive");
          };

          function appPainted() {
            var root = document.getElementById("root");
            if (!root) return false;
            var main = document.getElementById("main-content");
            if (main) {
              var r = main.getBoundingClientRect();
              var mainStyle = window.getComputedStyle(main);
              if (
                r.width > 0 &&
                r.height > 0 &&
                mainStyle.display !== "none" &&
                mainStyle.visibility !== "hidden" &&
                parseFloat(mainStyle.opacity || "1") > 0
              ) return true;
            }
            if (root.children && root.children.length > 0) {
              var rr = root.getBoundingClientRect();
              var rootStyle = window.getComputedStyle(root);
              if (
                rr.width > 0 &&
                rr.height > 0 &&
                rootStyle.display !== "none" &&
                rootStyle.visibility !== "hidden" &&
                parseFloat(rootStyle.opacity || "1") > 0 &&
                root.textContent &&
                root.textContent.trim().length > 0
              ) return true;
            }
            return false;
          }

          // Soft recovery
          setTimeout(function () {
            if (document.visibilityState === "hidden") {
              emit("soft-skip", { reason: "document hidden" });
              return;
            }
            if (appPainted()) return;
            emit("soft-recover", { reason: "main not painted" });
            try {
              console.warn("[white-screen-detector] Soft recovery triggered", {
                pageUrl: location.href,
                elapsedMs: Date.now() - bootedAt,
              });
              window.dispatchEvent(new CustomEvent("lovable:white-screen-recover"));
              window.dispatchEvent(new Event("resize"));
            } catch (e) {}
          }, SOFT_TIMEOUT);

          // Hard recovery
          setTimeout(function () {
            if (document.visibilityState === "hidden") {
              emit("hard-skip", { reason: "document hidden" });
              return;
            }
            if (appPainted()) return;
            try {
              if (sessionStorage.getItem(RELOAD_FLAG)) {
                emit("hard-skip", { reason: "already reloaded this session" });
                return;
              }
              sessionStorage.setItem(RELOAD_FLAG, String(Date.now()));
            } catch (e) {}
            emit("hard-reload");
            try {
              console.warn("[white-screen-detector] App not painted within " + HARD_TIMEOUT + "ms — reloading.", {
                pageUrl: location.href,
                elapsedMs: Date.now() - bootedAt,
              });
            } catch (e) {}
            location.reload();
          }, HARD_TIMEOUT);

          var clearInt = setInterval(function () {
            if (appPainted()) {
              try { sessionStorage.removeItem(RELOAD_FLAG); } catch (e) {}
              clearInterval(clearInt);
            } else if (Date.now() - bootedAt > HARD_TIMEOUT + 5000) {
              clearInterval(clearInt);
            }
          }, 500);
        } catch (e) {
          // Detector must never break the app.
        }
      })();
    </script>
