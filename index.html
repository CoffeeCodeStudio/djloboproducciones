    <!-- White-screen detector: if the React app hasn't reported "alive" within
         3s (and #main-content isn't painted), try a soft recovery; after a
         further 4s without recovery, force a hard reload (once per session). -->
    <script>
      (function () {
        try {
          var SOFT_TIMEOUT = 3000;
          var HARD_TIMEOUT = 7000; // total from boot
          var RELOAD_FLAG = "__lovable_white_screen_reloaded__";
          var bootedAt = Date.now();
          var alive = false;

          window.__lovableReportAlive = function () {
            alive = true;
            window.__lovableAlive = true;
          };

          function appPainted() {
            if (alive) return true;
            var root = document.getElementById("root");
            if (!root) return false;
            // Heuristic: main content node exists and has measurable size.
            var main = document.getElementById("main-content");
            if (main) {
              var r = main.getBoundingClientRect();
              if (r.width > 0 && r.height > 0) return true;
            }
            // Fallback: root has any rendered children with size.
            if (root.children && root.children.length > 0) {
              var rr = root.getBoundingClientRect();
              if (rr.width > 0 && rr.height > 0) return true;
            }
            return false;
          }

          // Soft recovery: dispatch an event the app can listen to; also clear
          // any stuck overlays from extensions and re-trigger a resize.
          setTimeout(function () {
            if (appPainted()) return;
            try {
              window.dispatchEvent(new CustomEvent("lovable:white-screen-recover"));
              // Nudge layout in case a CSS/iframe race left it 0x0.
              window.dispatchEvent(new Event("resize"));
            } catch (e) {}
          }, SOFT_TIMEOUT);

          // Hard recovery: reload once per session if still blank.
          setTimeout(function () {
            if (appPainted()) return;
            try {
              if (sessionStorage.getItem(RELOAD_FLAG)) return;
              sessionStorage.setItem(RELOAD_FLAG, String(Date.now()));
            } catch (e) {}
            try {
              console.warn("[white-screen-detector] App not painted within " + HARD_TIMEOUT + "ms — reloading.");
            } catch (e) {}
            location.reload();
          }, HARD_TIMEOUT);

          // Clear the reload flag once the app has painted, so a future stuck
          // session can also recover automatically.
          var clearInt = setInterval(function () {
            if (appPainted()) {
              try { sessionStorage.removeItem(RELOAD_FLAG); } catch (e) {}
              clearInterval(clearInt);
            } else if (Date.now() - bootedAt > HARD_TIMEOUT + 5000) {
              clearInterval(clearInt);
            }
          }, 500);
        } catch (e) {
          // Detector must never break the app.
        }
      })();
    </script>
